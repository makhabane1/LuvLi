# Luvli — Netlify configuration
#
# This file makes the optional real-AI coach work: the static Luvli app is
# published from the repo root, and netlify/functions/luvli-coach.js is served
# at the tidy path /api/luvli-coach that js/coach-config.js points at.
#
# Nothing here is needed to run Luvli locally — it only matters when you deploy.
# If you never deploy, or never set COACH_API_KEY, Luvli ignores all of this and
# the coach uses its on-device brain.

[build]
  publish = "."
  functions = "netlify/functions"

# The bare domain shows the public marketing page (landing.html) instead of
# the app shell. index.html (the app) is untouched and still reachable
# directly — every existing internal "location.href = 'index.html'" link
# keeps working exactly as before.
[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200

# /api/luvli-coach  →  the serverless function
[[redirects]]
  from = "/api/luvli-coach"
  to = "/.netlify/functions/luvli-coach"
  status = 200

# /api/delete-account  →  the serverless function (needs SUPABASE_SERVICE_ROLE_KEY set)
[[redirects]]
  from = "/api/delete-account"
  to = "/.netlify/functions/delete-account"
  status = 200

# Real push reminders: checks for activities about to start every 5 minutes.
# Needs SUPABASE_SERVICE_ROLE_KEY and VAPID_PRIVATE_KEY set; otherwise no-ops.
[functions."send-reminders"]
  schedule = "*/5 * * * *"

# A gentle security header set for the static app
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
